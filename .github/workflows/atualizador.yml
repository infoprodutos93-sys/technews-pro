name: Atualizar Portal TechNews PRO

on:
  schedule:
    # Roda automaticamente a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Cria um botão para você atualizar manualmente quando quiser

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python na nuvem
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar biblioteca requests
        run: pip install requests

      - name: 4. Executar gerador de notícias Multi-API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python gerador_noticias.py

      - name: 5. Salvar o novo index.html atualizado no site
        run: |
          git config --global user.name "Robô TechNews"
          git config --global user.email "bot@technews.pro"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Atualização automática de notícias" && git push)
