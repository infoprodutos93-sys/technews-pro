name: Atualizar Portal TechNews PRO

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python na nuvem
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar biblioteca requests
        run: pip install requests

      - name: 4. Gerar Ecossistema Multi-Páginas (Index, Hub IA, Cotações e Sitemap)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python gerador_noticias.py --gerar-site

      - name: 5. Publicar páginas, Sitemap e Feed RSS no GitHub Pages
        run: |
          git config --global user.name "Robô TechNews"
          git config --global user.email "bot@technews.pro"
          git add *.html *.xml .ultimo_post_meta.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Deploy v7.0: SEO Programático, OneSignal e RSS" && git push)

      - name: 6. Aguardar 45s para propagação e Disparar Redes + OneSignal Push
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: |
          echo "Aguardando 45 segundos para o GitHub Pages atualizar as tags..."
          sleep 45
          python gerador_noticias.py --postar-redes
