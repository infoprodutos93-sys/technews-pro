name: Atualizar Portal TechNews PRO

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python na nuvem
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar biblioteca requests
        run: pip install requests

      - name: 4. Executar gerador de notícias e Agente Meta
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: python gerador_noticias.py

      - name: 5. Salvar o novo index.html e histórico no site
        run: |
          git config --global user.name "Robô TechNews"
          git config --global user.email "bot@technews.pro"
          git add index.html .ultimo_post_meta.txt || git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Atualização automática de notícias e Social" && git push)
