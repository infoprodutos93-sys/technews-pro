name: Atualizar Portal TechNews PRO

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11 na nuvem
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar FFmpeg, Fontes TrueType e Bibliotecas Python
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pip install --upgrade pip
          pip install requests "Pillow>=10.0.0" "moviepy<2.0.0" imageio-ffmpeg

      - name: 4. Gerar Ecossistema Web Completo (Index, Hubs SEO, Futebol, Cotações, Sitemap e RSS)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          API_FUTEBOL_KEY: ${{ secrets.API_FUTEBOL_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: python gerador_noticias.py --gerar-site

      - name: 5. Publicar páginas, Sitemap e Feed RSS no GitHub Pages
        run: |
          git config --global user.name "Robô TechNews"
          git config --global user.email "bot@technews.pro"
          git add *.html *.xml .ultimo_post_meta.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Deploy Master v8.1: Portal Auditado, Futebol, RSS & Vídeo" && git push)

      - name: 6. Aguardar 45s para propagação e Disparar Vídeo no Facebook + Telegram + OneSignal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: |
          echo "Aguardando 45 segundos para o GitHub Pages atualizar as tags Open Graph..."
          sleep 45
          python gerador_noticias.py --postar-redes
